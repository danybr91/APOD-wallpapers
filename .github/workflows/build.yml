name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid:
          - win-x64
          - linux-x64
          - osx-x64
          - osx-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: |
          dotnet publish APOD\ wallpapers.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -o publish/${{ matrix.rid }}

      - name: Package
        run: |
          cd publish
          zip -r ../APOD\ wallpapers-${{ github.ref_name }}-${{ matrix.rid }}.zip ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: APOD\ wallpapers-${{ github.ref_name }}-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
